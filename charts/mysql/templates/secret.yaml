{{- if not .Values.auth.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "mysql.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.auth.rootPasswordKey }}: {{ required "auth.rootPassword or auth.existingSecret is required" .Values.auth.rootPassword | quote }}
  {{ .Values.auth.passwordKey }}: {{ required "auth.password or auth.existingSecret is required" .Values.auth.password | quote }}
{{- end }}
