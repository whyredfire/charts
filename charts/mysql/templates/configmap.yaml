apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "mysql.labels" . | nindent 4 }}
data:
  custom.cnf: |
    [mysqld]
    # The volume root holds lost+found, and MySQL only initializes an empty directory
    datadir=/var/lib/mysql/data
    {{- .Values.config | nindent 4 }}
