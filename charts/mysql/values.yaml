image:
  # -- MySQL image repository
  repository: mysql
  # -- MySQL image tag
  tag: "9.7.4"
  # -- MySQL image pull policy
  pullPolicy: IfNotPresent

# -- Database created on the first start. Changing it later has no effect
database: app

# -- User created on the first start with full access to `database`. Changing it later has no effect
username: app

auth:
  # -- (string) Existing Secret with the root and user passwords. When set, the chart creates no Secret
  existingSecret: ~
  # -- Key holding the root password
  rootPasswordKey: MYSQL_ROOT_PASSWORD
  # -- Key holding the user's password
  passwordKey: MYSQL_PASSWORD
  # -- (string) Root password, used only without `existingSecret`
  rootPassword: ~
  # -- (string) User's password, used only without `existingSecret`
  password: ~

# -- Extra options for the `[mysqld]` section
config: |
  innodb_buffer_pool_size=256M

persistentVolume:
  # -- Persistent volume size
  size: 10Gi
  # -- (string) Storage class, empty uses the cluster's default
  storageClass: ~

# -- CPU/Memory resource requests/limits
resources: {}

# -- Node selector for the MySQL pod
nodeSelector: {}

# -- Tolerations for the MySQL pod
tolerations: []
